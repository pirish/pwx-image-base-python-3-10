apiVersion: kaptain.org/1.11
kind: docker-build-dockerfile
metadata:
  description: "Python 3.10 environment base image"

spec:
  main:
    docker:
      platform: linux/amd64,linux/arm64
      dockerfile:
        subPathLinuxAmd64: src/docker
        subPathLinuxArm64: src/docker
  layers:
    - ghcr.io/kube-kaptain/layer/layer-github-flow-strict:[1.3,2.0)
